name: Auto Deploy to Ubuntu Server via Docker

on:
  push:
    branches:
      - main  # Setiap kali ada push ke branch main, deploy otomatis berjalan

jobs:
  deploy:
    name: Deploy to Ubuntu Docker Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy via SSH to Ubuntu Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}        # IP Publik Server Ubuntu Anda
          username: ${{ secrets.SERVER_USERNAME }} # Username server (misal: luckyal / root)
          password: ${{ secrets.SERVER_PASSWORD }} # Password login SSH server
          key: ${{ secrets.SERVER_SSH_KEY }}       # Private SSH Key Anda (opsional jika pakai password)
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            if [ -d "/var/www/network-trouble-ticketing" ]; then
              cd /var/www/network-trouble-ticketing
            elif [ -d "/var/www/net-ticketing" ]; then
              cd /var/www/net-ticketing
            elif [ -d "$HOME/network-trouble-ticketing" ]; then
              cd "$HOME/network-trouble-ticketing"
            elif [ -d "/root/network-trouble-ticketing" ]; then
              cd /root/network-trouble-ticketing
            fi
            echo "Current directory: $(pwd)"
            git fetch origin main
            git reset --hard origin/main
            mkdir -p uploads && chmod -R 777 uploads 2>/dev/null || (sudo mkdir -p uploads && sudo chmod -R 777 uploads)
            docker compose up -d --build || sudo docker compose up -d --build
            echo "Deployment to Ubuntu Server Completed Successfully!"
